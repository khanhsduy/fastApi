name: Build and Deploy Docker to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/khanhsduy/fastapi
  AZURE_WEBAPP_NAME: khanhsduy
  MODEL_FILE: saved_model/stegastamp_pretrained/variables/variables.data-00000-of-00001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout source with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force LFS checkout
        shell: bash
        run: |
          set -e

          echo "=== Git LFS version ==="
          git lfs version

          echo "=== LFS files ==="
          git lfs ls-files -l

          echo "=== Model before ==="
          ls -lh "${{ env.MODEL_FILE }}"

          git lfs checkout

          echo "=== Model after ==="
          ls -lh "${{ env.MODEL_FILE }}"

      - name: Verify TensorFlow model
        shell: bash
        run: |
          set -e

          SIZE=$(stat -c%s "${{ env.MODEL_FILE }}")

          echo "Model size: ${SIZE} bytes"

          if [ "${SIZE}" -ne 217018916 ]; then
            echo "ERROR: Git LFS model is not materialized."
            echo "Expected: 217018916 bytes"
            echo "Actual: ${SIZE} bytes"

            echo "=== LFS ENV ==="
            git lfs env

            echo "=== LFS OBJECTS ==="
            find .git/lfs/objects -type f -ls || true

            exit 1
          fi

          echo "OK: TensorFlow model is 217018916 bytes."

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_12EE4810B00849DE879F73F9FBAC2C05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A928D275EC34A64ACA366C930288299 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5408599D2612410989218884C5312265 }}

      - name: Configure Azure Web App container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --container-image-name "${{ env.IMAGE_NAME }}:latest" \
              --container-registry-url "https://ghcr.io" \
              --container-registry-user "${{ github.actor }}" \
              --container-registry-password "${{ secrets.GHCR_PAT }}"

            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --settings WEBSITES_PORT=8000

            az webapp restart \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
