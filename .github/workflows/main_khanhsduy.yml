name: Build and Deploy Docker to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/khanhsduy/fastapi
  AZURE_WEBAPP_NAME: khanhsduy
  MODEL_FILE: saved_model/stegastamp_pretrained/variables/variables.data-00000-of-00001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ==============================
      # CHECKOUT SOURCE + GIT LFS
      # ==============================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Fetch Git LFS files
        run: |
          git lfs install
          git lfs fetch
          git lfs checkout

      # ==============================
      # VERIFY MODEL
      # ==============================
      - name: Check model files
        run: |
          echo "=== Git LFS files ==="
          git lfs ls-files

          echo ""
          echo "=== SavedModel ==="
          ls -lah saved_model/stegastamp_pretrained

          echo ""
          echo "=== Variables ==="
          ls -lah saved_model/stegastamp_pretrained/variables

          echo ""
          echo "=== Model file size ==="
          stat -c "%n : %s bytes" "${{ env.MODEL_FILE }}"

      - name: Verify model is not Git LFS pointer
        run: |
          MODEL_SIZE=$(stat -c%s "${{ env.MODEL_FILE }}")

          echo "Model size: ${MODEL_SIZE} bytes"

          if [ "${MODEL_SIZE}" -lt 1000000 ]; then
            echo "=========================================="
            echo "ERROR: TensorFlow model is still LFS pointer"
            echo "Expected model file > 1 MB"
            echo "Actual size: ${MODEL_SIZE} bytes"
            echo "=========================================="

            echo ""
            echo "File content:"
            cat "${{ env.MODEL_FILE }}" || true

            exit 1
          fi

          echo "OK: TensorFlow model file is real."

      # ==============================
      # LOGIN GHCR
      # ==============================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # BUILD + PUSH DOCKER
      # ==============================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ==============================
      # LOGIN AZURE
      # ==============================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_12EE4810B00849DE879F73F9FBAC2C05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A928D275EC34A64ACA366C930288299 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5408599D2612410989218884C5312265 }}

      # ==============================
      # CONFIGURE AZURE WEB APP
      # ==============================
      - name: Configure Azure Web App container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --container-image-name "${{ env.IMAGE_NAME }}:latest" \
              --container-registry-url "https://ghcr.io" \
              --container-registry-user "${{ github.actor }}" \
              --container-registry-password "${{ secrets.GHCR_PAT }}"

            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --settings WEBSITES_PORT=8000

            az webapp restart \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
