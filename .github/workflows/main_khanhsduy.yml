name: Build and Deploy Docker to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/khanhsduy/fastapi
  AZURE_WEBAPP_NAME: khanhsduy
  MODEL_FILE: saved_model/stegastamp_pretrained/variables/variables.data-00000-of-00001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ==============================
      # CHECKOUT SOURCE
      # ==============================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # ==============================
      # DOWNLOAD GIT LFS MODEL
      # ==============================
      - name: Download Git LFS model
        shell: bash
        run: |
          set -e

          echo "=== Git LFS version ==="
          git lfs version

          echo "=== Install Git LFS ==="
          git lfs install --local

          echo "=== Git remote ==="
          git remote -v

          echo "=== Git LFS environment ==="
          git lfs env

          echo "=== LFS files before pull ==="
          git lfs ls-files

          echo "=== Current model size ==="
          ls -lh "${{ env.MODEL_FILE }}"

          echo "=== Pull LFS objects ==="
          git lfs pull origin main

          echo "=== Fetch LFS objects ==="
          git lfs fetch origin main

          echo "=== Checkout LFS files ==="
          git lfs checkout

          echo "=== LFS files after checkout ==="
          git lfs ls-files

          echo "=== Model file after LFS checkout ==="
          ls -lh "${{ env.MODEL_FILE }}"

      # ==============================
      # VERIFY MODEL
      # ==============================
      - name: Verify TensorFlow model
        shell: bash
        run: |
          set -e

          MODEL_SIZE=$(stat -c%s "${{ env.MODEL_FILE }}")

          echo "Model size: ${MODEL_SIZE} bytes"

          if [ "${MODEL_SIZE}" -lt 200000000 ]; then
            echo "=========================================="
            echo "ERROR: Git LFS model was not downloaded"
            echo "Expected size: 217018916 bytes"
            echo "Actual size: ${MODEL_SIZE} bytes"
            echo "=========================================="

            echo "Current file content:"
            cat "${{ env.MODEL_FILE }}" || true

            exit 1
          fi

          echo "=========================================="
          echo "OK: TensorFlow model is real"
          echo "=========================================="

          ls -lh "${{ env.MODEL_FILE }}"

      # ==============================
      # LOGIN GHCR
      # ==============================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # BUILD + PUSH DOCKER IMAGE
      # ==============================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ==============================
      # LOGIN AZURE
      # ==============================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_12EE4810B00849DE879F73F9FBAC2C05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A928D275EC34A64ACA366C930288299 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5408599D2612410989218884C5312265 }}

      # ==============================
      # CONFIGURE AZURE
      # ==============================
      - name: Configure Azure Web App container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --container-image-name "${{ env.IMAGE_NAME }}:latest" \
              --container-registry-url "https://ghcr.io" \
              --container-registry-user "${{ github.actor }}" \
              --container-registry-password "${{ secrets.GHCR_PAT }}"

            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --settings WEBSITES_PORT=8000

            az webapp restart \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
