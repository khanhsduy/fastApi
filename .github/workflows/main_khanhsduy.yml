
name: Build and Deploy Docker to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/khanhsduy/fastapi
  AZURE_WEBAPP_NAME: khanhsduy

  MODEL_DIR: saved_model/stegastamp_finetune
  MODEL_FILE: saved_model/stegastamp_finetune/variables/variables.data-00000-of-00001
  CONTAINER_MODEL_FILE: /app/saved_model/stegastamp_finetune/variables/variables.data-00000-of-00001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ==========================================
      # 1. CHECKOUT SOURCE + LFS
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      # ==========================================
      # 2. LOAD MODEL THEO COMMIT HIỆN TẠI
      # ==========================================
      - name: Download current LFS model
        shell: bash
        run: |
          set -euo pipefail

          echo "=== GIT LFS FILES ==="
          git lfs ls-files -l

          echo "=== DOWNLOAD CURRENT LFS DATA ==="
          git lfs pull

          echo "=== MODEL DIRECTORY ==="
          ls -lah "$MODEL_DIR"
          ls -lah "$MODEL_DIR/variables"

          test -f "$MODEL_DIR/saved_model.pb"
          test -f "$MODEL_DIR/variables/variables.index"
          test -f "$MODEL_FILE"

      # ==========================================
      # 3. KIỂM TRA SHA256 THEO GIT LFS POINTER
      # ==========================================
      - name: Verify current model SHA256
        shell: bash
        run: |
          set -euo pipefail

          echo "=== READ CURRENT COMMIT POINTER ==="
          git show "HEAD:$MODEL_FILE" > /tmp/model.pointer

          cat /tmp/model.pointer

          EXPECTED_SHA=$(
            sed -n 's/^oid sha256://p' /tmp/model.pointer
          )

          EXPECTED_SIZE=$(
            sed -n 's/^size //p' /tmp/model.pointer
          )

          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: Invalid LFS SHA256"
            exit 1
          fi

          if ! [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid LFS size"
            exit 1
          fi

          ACTUAL_SHA=$(sha256sum "$MODEL_FILE" | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s "$MODEL_FILE")

          echo "=== COMPARE MODEL ==="
          echo "Expected size: $EXPECTED_SIZE"
          echo "Actual size:   $ACTUAL_SIZE"
          echo "Expected SHA:  $EXPECTED_SHA"
          echo "Actual SHA:    $ACTUAL_SHA"

          if [ "$EXPECTED_SIZE" != "$ACTUAL_SIZE" ]; then
            echo "ERROR: MODEL SIZE MISMATCH"
            exit 1
          fi

          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: MODEL CHECKSUM MISMATCH"
            exit 1
          fi

          echo "=== OTHER MODEL FILES ==="
          sha256sum "$MODEL_DIR/saved_model.pb"
          sha256sum "$MODEL_DIR/variables/variables.index"

          echo "SUCCESS: LFS MODEL CHECKSUM VERIFIED"

      # ==========================================
      # 4. LOGIN GHCR
      # ==========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 5. BUILD DOCKER - CHƯA PUSH
      # ==========================================
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ==========================================
      # 6. KIỂM TRA MODEL TRONG DOCKER IMAGE
      # ==========================================
      - name: Verify model inside Docker
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "=== CREATE TEMPORARY CONTAINER ==="
          CONTAINER_ID=$(docker create "$IMAGE")

          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          mkdir -p /tmp/model-check

          echo "=== EXTRACT MODEL FROM DOCKER ==="
          docker cp \
            "$CONTAINER_ID:$CONTAINER_MODEL_FILE" \
            /tmp/model-check/model.data

          SOURCE_SHA=$(sha256sum "$MODEL_FILE" | awk '{print $1}')
          DOCKER_SHA=$(sha256sum /tmp/model-check/model.data | awk '{print $1}')

          SOURCE_SIZE=$(stat -c%s "$MODEL_FILE")
          DOCKER_SIZE=$(stat -c%s /tmp/model-check/model.data)

          echo "Source SHA: $SOURCE_SHA"
          echo "Docker SHA: $DOCKER_SHA"
          echo "Source size: $SOURCE_SIZE"
          echo "Docker size: $DOCKER_SIZE"

          if [ "$SOURCE_SHA" != "$DOCKER_SHA" ]; then
            echo "ERROR: Docker model checksum mismatch"
            exit 1
          fi

          if [ "$SOURCE_SIZE" != "$DOCKER_SIZE" ]; then
            echo "ERROR: Docker model size mismatch"
            exit 1
          fi

          echo "SUCCESS: DOCKER MODEL VERIFIED"

      # ==========================================
      # 7. PUSH DOCKER KHI FILE HỢP LỆ
      # ==========================================
      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      # ==========================================
      # 8. LOGIN AZURE
      # ==========================================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_12EE4810B00849DE879F73F9FBAC2C05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0A928D275EC34A64ACA366C930288299 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5408599D2612410989218884C5312265 }}

      # ==========================================
      # 9. DEPLOY AZURE
      # ==========================================
      - name: Configure Azure Web App container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e

            echo "Deploying Docker image"
            echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"

            az webapp config container set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --container-image-name "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --container-registry-url "https://ghcr.io" \
              --container-registry-user "${{ github.actor }}" \
              --container-registry-password "${{ secrets.GHCR_PAT }}"

            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --settings WEBSITES_PORT=8000

            az webapp restart \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
